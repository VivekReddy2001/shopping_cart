# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → select this repository. You will be asked for the
# values marked `sync: false` (MongoDB Atlas URI, admin credentials, URL).
services:
  - type: web
    name: kartly
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_NAME
        value: Vivek Reddy
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTO_SEED
        value: "true"
      - key: SEED_DEMO_ORDERS
        value: "true"
      - key: DEMO_ACCOUNTS
        value: "true"
